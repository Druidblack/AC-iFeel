esphome:
  name: hisense-ir-tx
  friendly_name: Hisense IR TX

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components

mqtt:
  broker: 192.168.1.10
  username: !secret mqtt_user
  password: !secret mqtt_password

  # Безопасный MQTT-режим: эта нода нужна только как подписчик IR-команд.
  discovery: false
  discover_ip: false
  discovery_retain: false
  topic_prefix: null
  log_topic: null
  birth_message:
  will_message:
  shutdown_message:

remote_transmitter:
  id: ir_tx
  pin: GPIO23
  carrier_duty_percent: 50%

kelon168_mqtt_ir:
  transmitter_id: ir_tx
  topic: hisense_ac_zal/ir/kelon168/tx
  qos: 0
  send_times: 1
